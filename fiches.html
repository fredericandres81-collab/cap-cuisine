<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Fiches techniques – CAP Cuisine</title>
  <meta name="description" content="Toutes les fiches techniques du CAP Cuisine : denrées, matériel, étapes et schémas.">
  <link rel="stylesheet" href="style.css?v=202611210147">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <p class="eyebrow">MFR de Peyregoux · CAP Cuisine</p>
      <h1>Fiches techniques</h1>
      <p class="lead">Cherche une recette, adapte les quantités au nombre de couverts et imprime la fiche.</p>
    </div>
  </header>
  <nav class="tabs" aria-label="Sections">
    <div class="wrap tabs-inner">
      <a href="index.html#revision">Révision</a>
      <a href="quiz.html">Quiz</a>
      <a href="fiches.html" aria-current="page">Fiches techniques</a>
    </div>
  </nav>

  <main class="wrap">
    <!-- Écran du code d'accès -->
    <section id="verrou" class="card verrou" hidden>
      <p class="verrou-icone" aria-hidden="true">🔒</p>
      <h2>Fiches réservées à la classe</h2>
      <p class="muted">Entre le code d'accès donné par ton formateur.</p>
      <form id="form-code" autocomplete="off">
        <label class="sr-only" for="code">Code d'accès</label>
        <input id="code" type="password" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Code d'accès" required>
        <button class="btn" type="submit">Entrer</button>
      </form>
      <p id="msg-code" class="msg-code" aria-live="polite"></p>
    </section>

    <!-- Liste -->
    <section id="liste" hidden>
      <div class="search-bar">
        <label class="sr-only" for="q">Rechercher une fiche</label>
        <input id="q" type="search" placeholder="Rechercher : sole, crème anglaise, beurre blanc…" autocomplete="off">
      </div>
      <div class="chips" id="themes" role="group" aria-label="Filtrer par thème"></div>
      <div id="semaines"></div>
      <p class="muted" id="compte" aria-live="polite"></p>
      <div id="resultats"></div>
    </section>

    <!-- Détail d'une fiche -->
    <article id="fiche" hidden></article>
  </main>

  <footer class="site-footer">
    <div class="wrap">MFR de Peyregoux · CAP Cuisine</div>
  </footer>

  <script src="fiches.js?v=202611210147"></script>
</body>
</html>
